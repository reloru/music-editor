name = "music-editor"
main = "worker/index.ts"
compatibility_date = "2025-11-01"

# The built SPA is uploaded as static assets and served straight from Cloudflare's
# edge. The Worker script only runs for the routes listed in `run_worker_first`,
# so page loads and JS/CSS fetches never pay for a Worker invocation.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/s/*"]

[observability]
enabled = true

[vars]
# Maximum size (bytes) accepted by the optional share endpoint. 25 MiB.
SHARE_MAX_BYTES = "26214400"
# How long a shared clip lives before R2 expires it, in seconds. 7 days.
SHARE_TTL_SECONDS = "604800"

# ---------------------------------------------------------------------------
# OPTIONAL: share links.
#
# Everything in this editor works with no bindings at all — audio is decoded,
# edited and exported on the phone and never leaves it. If you also want the
# "Share link" button (uploads one rendered clip and hands back a short URL),
# create an R2 bucket and uncomment the binding below:
#
#   npx wrangler r2 bucket create music-editor-shares
#
# Without the binding the API returns 501 and the UI hides the button.
# ---------------------------------------------------------------------------
# [[r2_buckets]]
# binding = "SHARES"
# bucket_name = "music-editor-shares"
